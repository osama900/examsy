  <style>
    body,
    html {
      margin: 0;
      padding: 0;

      display: flex;
      flex-direction: column;
    }

    .content {
      flex: 1;
      display: flex;

      flex: 1;
      width: 100%;

    }

    .instructions {
      padding: 10px;
      padding-top: 80px;
      background-color: #918971;
      color: #333;
      font-size: 16px;
      text-align: center;
      border-bottom: 1px solid #080606;
      font-weight: bolder;
    }

    .markmap-dark {
      background: #27272a;
      color: white;
    }
  </style>
</head>

<body>
  <div class="headerdiv">
    <header class="main-header">
      <div class="header-content">
        <a href="../../../index.html" class="logo-link">
          <span class="logo-emoji">📚</span>
          <span class="logo-text">الاختبارات الالكترونية</span>

  <div class="content">
    <!-- التعليمات كنص مستقل -->
    <div class="instructions">
      📌 التعليمات : يجب النقر على الدائرة الممتلئة لفتح الشرح و يمكن التكبير
      و التصغير و التحريك
    </div>

    <!-- mindmap هنا -->
    <svg id="mindmap"></svg>
  </div>

  <footer>جميع الحقوق محفوظة © Teacher Osama Omar</footer>

  <!-- مكتبات markmap -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.18.12/dist/browser/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-toolbar@0.18.12/dist/index.js"></script>

  <script>
    (() => {
      setTimeout(() => {
        const { markmap: S, mm: Q } = window,
          $ = new S.Toolbar();
        $.attach(Q);
        const I = $.render();
        I.setAttribute("style", "position:absolute;bottom:20px;right:20px");
        document.body.append(I);
      });
    })();
  </script>
  <script>
    ((l, U, M, R) => {
      const N = l();
      (window.mm = N.Markmap.create(
        "svg#mindmap",
        (U || N.deriveOptions)(R),
        M
      )),
        window.matchMedia("(prefers-color-scheme: dark)").matches &&
        document.documentElement.classList.add("markmap-dark");
    })(
      () => window.markmap,
      null,
      {
        content: "صيانة الأعطال المادية (Computer Hardware Maintenance) 🛠️",
        children: [

          {
            content: "مسببات الأعطال المادية",
            children: [
              { content: "الظروف البيئية (حرارة، رطوبة، غبار)." },
              { content: "الاستخدام غير الصحيح والتنظيف الخاطئ." },
              { content: "انتهاء العمر الافتراضي للمكونات." },
              { content: "عيوب تصنيعية وخلل التعريفات." }
            ]
          },

          {
            content: "إرشادات التشخيص الأولية",
            children: [
              { content: "فحص وتدوين رسائل الخطأ." },
              { content: "التأكد من سلامة وصحة التوصيلات." },
              { content: "تتبع الإجراء الأخير قبل العطل." },
              { content: "استخدام المخططات الانسيابية (Flowcharts)." }
            ]
          },

          {
            content: "أعطال الملحقات الخارجية",
            children: [
              {
                content: "الفأرة (Mouse)",
                children: [
                  { content: "توقف العمل: فحص الكابل أو البطارية." },
                  { content: "صعوبة التحكم: تنظيف أسفل الفأرة." },
                  { content: "السرعة الزائدة/البطء: ضبط السرعة من Settings." }
                ]
              },
              {
                content: "لوحة المفاتيح (Keyboard)",
                children: [
                  { content: "خطأ Keyboard Error: إرجاع التوصيل أو تحديث التعريف." },
                  { content: "تعلق المفاتيح: التنظيف بنفاخ الهواء (Blower)." }
                ]
              },
              {
                content: "الشاشة (Monitor)",
                children: [
                  { content: "الشاشة مظلمة: فحص كابل الطاقة والتوصيلات." },
                  { content: "ألوان رديئة/تموج: تغيير كابل البيانات أو بطاقة الشاشة." },
                  { content: "غياب الألوان الأساسية: إبعاد المجال المغناطيسي." }
                ]
              },
              {
                content: "السماعات (Speakers)",
                children: [
                  { content: "غياب الصوت: فحص مفتاح الصوت (Volume)." },
                  { content: "خلل الصوت: إعادة تركيب/تعريف بطاقة الصوت." }
                ]
              },
              {
                content: "الطابعة (Printer)",
                children: [
                  { content: "توقف الضوء برتقالي: إزالة الورق المحشور." },
                  { content: "طباعة باهتة: تزويد الحبر." },
                  { content: "سحب أوراق متعددة: استبدال الورق الرطب." }
                ]
              }
            ]
          },

          {
            content: "أعطال المكونات الداخلية",
            children: [
              {
                content: "الذاكرة الرئيسة (RAM)",
                children: [
                  { content: "تعليق الجهاز (Hanging): استبدال ذاكرة RAM." },
                  { content: "صوت Beep / حجم خاطئ: إعادة تثبيتها في المنفذ." },
                  { content: "Insufficient Memory: زيادة السعة أو إغلاق التطبيقات." }
                ]
              },
              {
                content: "المعالج (CPU)",
                children: [
                  { content: "توقف مفاجئ: صيانة التبريد والمروحة." },
                  { content: "شاشة سوداء ثابتة: استبدال المعالج." }
                ]
              },
              {
                content: "وحدات التخزين (HDD / SSD)",
                children: [
                  { content: "ضوضاء عالية في HDD: عطل مادي يحتاج فني." },
                  { content: "بطء النظام: تنظيف القرص وإصلاح الملفات التالفة." },
                  { content: "الفرق: SSD أسرع وأكثر موثوقية وبلا أجزاء متحركة." }
                ]
              }

            ]
          }

        ]
      },
      { colorFreezeLevel: 2, initialExpandLevel: 2 }
    );
  </script>
